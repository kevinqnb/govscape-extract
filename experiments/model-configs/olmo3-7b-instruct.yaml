key: olmo3-7b-instruct
kind: llm
model: allenai/Olmo-3-7B-Instruct
role: candidate
serving: local_vllm  # was "external"
hardware:
  device: cuda
  min_vram_gb: 24
  gpu_count: 1
  gpu_compute_capability: "8.0"
  max_walltime: "24:00:00"
  notes: >-
    ~7.3B params, ~15GB of bf16 weights; a 24GB card leaves enough for the KV cache
    at the 16384 context pinned below.
vllm_args: ["--max-model-len", "16384"]
notes: >-
  No thinking knob: reasoning is a separate Olmo-3-7B-Think checkpoint; the
  Instruct model configured here has no reasoning mode to disable.
